# ==============================================================================
# VulnFollowUp - Configuración de Persistencia Spring Boot
# Proyecto Intermodular · 2.º DAM · Instituto Nebrija FP
# ==============================================================================

spring.application.name=vulnfollowup-backend

# Configuración del DataSource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/vulnfollowup_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=usuario_prueba
spring.datasource.password=password_prueba
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Configuración de Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Buenas prácticas: deshabilitar Open-Session-In-View para evitar queries inesperadas en capa web
spring.jpa.open-in-view=false
